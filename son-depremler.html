<style>
  :root{
    --zemin:#0B0E11; --panel:#12171C; --panel2:#171D23; --cizgi:#232B33;
    --cizgi2:#1A2026; --metin:#DDE4EA; --soluk:#7E8B98; --parlak:#FFFFFF;
    --vurgu:#F0883E; --mavi:#5AA9E6; --yesil:#5CC98A; --kirmizi:#E8705F;
    --odak:#8AB4F8;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--zemin);color:var(--metin);
    font:400 14.5px/1.55 "Overpass",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  :focus-visible{outline:2px solid var(--odak);outline-offset:2px}
  button,a,summary,label,select,input{cursor:pointer}
  a{color:var(--mavi);text-decoration:none}
  a:hover{text-decoration:underline}
  .om{font-family:"Overpass Mono",ui-monospace,monospace;
      font-variant-numeric:tabular-nums}

  .ust{display:flex;align-items:stretch;background:var(--panel);
    border-bottom:1px solid var(--cizgi);overflow-x:auto;min-height:46px}
  .ust>*{display:flex;align-items:center;padding:0 14px;white-space:nowrap;
    border-right:1px solid var(--cizgi);gap:8px;color:inherit;
    text-decoration:none}
  .marka{font-weight:700;color:var(--parlak);background:var(--panel2)}
  .marka i{font-style:normal;color:var(--vurgu)}
  .sekme{font-size:13.5px;color:var(--soluk)}
  .depo{display:inline-flex;align-items:center;gap:6px}
  .depo svg{flex:0 0 auto}
  .sekme:hover{color:var(--metin);background:var(--panel2);text-decoration:none}
  .sekme[aria-current="page"]{color:var(--parlak);
    box-shadow:inset 0 -2px 0 var(--vurgu)}
  .kv{font-family:"Overpass Mono",monospace;font-size:12px;color:var(--soluk)}
  .kv b{color:var(--metin);font-weight:500}
  .ust .sag{margin-left:auto;border-right:0}

  .kap{max-width:74rem;margin:0 auto;padding:18px 14px 48px}
  h1{font-size:22px;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
  .altbaslik{color:var(--soluk);font-size:14px;margin:0 0 16px;max-width:78ch;
    line-height:1.6}

  .rakamlar{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));
    gap:10px;margin-bottom:16px}
  .rakam{background:var(--panel);border:1px solid var(--cizgi);padding:11px 13px}
  .rakam .et{font-family:"Overpass Mono",monospace;font-size:9.5px;
    letter-spacing:.16em;text-transform:uppercase;color:var(--soluk)}
  .rakam .dg{font-family:"Overpass Mono",monospace;font-size:24px;
    font-weight:600;line-height:1.15;margin-top:3px}
  .rakam .dg small{font-size:12px;font-weight:400;color:var(--soluk)}

  .not{background:var(--panel);border:1px solid var(--cizgi);
    border-left:3px solid var(--vurgu);padding:12px 14px;margin:0 0 16px;
    font-size:13.5px;line-height:1.6}
  .not b{color:var(--parlak)}
  .not .bas{font-family:"Overpass Mono",monospace;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--vurgu);
    display:block;margin-bottom:5px}

  .denetim{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--cizgi);padding:11px 13px;
    margin-bottom:12px}
  .alan{display:flex;flex-direction:column;gap:4px}
  .alan label{font-size:11px;color:var(--soluk);letter-spacing:.06em;
    text-transform:uppercase}
  .alan input,.alan select{background:var(--zemin);border:1px solid var(--cizgi);
    color:var(--metin);font:400 13.5px/1 "Overpass",sans-serif;padding:0 9px;
    height:36px;min-width:150px}
  .onay{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13.5px}
  .onay input{width:16px;height:16px;accent-color:var(--vurgu)}
  .sayim{margin-left:auto;font-family:"Overpass Mono",monospace;font-size:12px;
    color:var(--soluk);align-self:center}

  .tablosar{border:1px solid var(--cizgi);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{background:var(--panel2);text-align:left;padding:0 10px;height:30px;
    border-bottom:1px solid var(--cizgi);font-family:"Overpass Mono",monospace;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    font-weight:500;color:var(--soluk);white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--cizgi2)}
  tbody tr:hover{background:var(--panel)}
  tbody td{padding:9px 10px;vertical-align:top}
  .num{font-family:"Overpass Mono",monospace;font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .mag{font-family:"Overpass Mono",monospace;font-size:16px;font-weight:600;
    white-space:nowrap}
  .yer{font-weight:600;color:var(--parlak)}
  .yer small{display:block;color:var(--soluk);font-weight:400;font-size:12px}
  .rozet{font-family:"Overpass Mono",monospace;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;
    border:1px solid currentColor;white-space:nowrap;display:inline-block}
  .r-vardi{color:var(--yesil)} .r-yoktu{color:var(--soluk)}
  .r-yayinyok{color:var(--soluk);opacity:.75}
  .r-hedefdisi{color:var(--soluk)}
  .gerekce{font-size:12px;color:var(--soluk);line-height:1.5;margin-top:4px;
    max-width:46ch}
  .bosmesaj{padding:26px 12px;text-align:center;color:var(--soluk);font-size:14px}

  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--cizgi);
    font-size:12.5px;color:var(--soluk);line-height:1.7}
  footer b{color:var(--metin)}
  .baglar{display:flex;flex-wrap:wrap;gap:8px 16px;margin-bottom:8px}

  @media(max-width:44rem){
    body{font-size:15px}
    .ust{flex-wrap:wrap;min-height:0}
    .ust>*{flex:1 1 auto;min-width:50%;height:42px;border-right:0;
      border-bottom:1px solid var(--cizgi2)}
    .marka{min-width:100%;height:46px;font-size:16px}
    .ust .sag{margin-left:0}
    .alan input,.alan select{flex:1 1 100%;height:44px;font-size:16px;
      min-width:0;width:100%}
    .alan{flex:1 1 100%}
    .sayim{margin-left:0;flex:1 1 100%}
    thead{display:none}
    table,tbody,tr,td{display:block;width:100%}
    tbody tr{padding:11px 12px;border-bottom:1px solid var(--cizgi);
      display:grid;grid-template-columns:1fr auto;gap:3px 10px;
      align-items:baseline}
    tbody td{padding:0}
    .t-zaman{grid-column:1;grid-row:1;font-size:12px;color:var(--soluk)}
    .t-mag{grid-column:2;grid-row:1;text-align:right}
    .t-yer{grid-column:1/3;grid-row:2}
    .t-durum{grid-column:1/3;grid-row:3;margin-top:4px}
    .t-derinlik{display:none}
  }
</style>
</head>

<div class="kap">
  <h1>Son depremler</h1>
  <p class="altbaslik" id="altbaslik">Yükleniyor…</p>

  <div class="rakamlar" id="rakamlar"></div>

  <div class="not">
    <span class="bas">bu listedeki işaretler ne demek</span>
    <span id="iddia-notu"></span>
  </div>

  <div class="denetim">
    <div class="alan"><label for="q">Yer ara</label>
      <input id="q" type="search" autocomplete="off" placeholder="il veya ilçe…"></div>
    <div class="alan"><label for="ilsec">İl</label>
      <select id="ilsec"><option value="">tüm iller</option></select></div>
    <div class="alan"><label for="magsec">En az büyüklük</label>
      <select id="magsec">
        <option value="0">tümü</option><option value="3">M 3,0+</option>
        <option value="4">M 4,0+</option><option value="4.5">M 4,5+</option>
      </select></div>
    <label class="onay"><input type="checkbox" id="sadeceListede">
      yalnızca listede yer alanlar</label>
    <label class="onay"><input type="checkbox" id="sadeceTR" checked>
      yalnızca Türkiye içi</label>
    <span class="sayim" id="sayim"></span>
  </div>

  <div class="tablosar">
    <table><thead><tr>
      <th style="width:15%">zaman (TSİ)</th>
      <th style="width:9%">büyüklük</th>
      <th style="width:26%">yer</th>
      <th style="width:10%">derinlik</th>
      <th>olaydan önce yayımlanan listede</th>
    </tr></thead><tbody id="satirlar"></tbody></table>
  </div>

  <footer>
    <div class="baglar">
      <a href="index.html">Harita</a><a href="tahmin-kaydi.html">Tahmin kaydı</a>
      <a href="metodoloji.html">Yöntem ve sınırlılıklar</a>
      <a href="yasal.html">Yasal bilgiler</a>
      <a href="vaka-defteri.html">Vaka defteri</a>
      <a href="data/son_depremler.json">son_depremler.json</a>
    </div>
    <p id="kapsam-notu"></p>
    <p id="kaynaklar"></p>
  </footer>
</div>

<script src="script.js"></script>
<script>
let D = null;

function durumRozeti(o){
  if(!o.hedef_buyuklukte)
    return {sinif:"r-hedefdisi", metin:"hedef dışı",
      gerekce:"Yayımlanan liste M4,5 ve üzeri için üretilir. Bu olay daha " +
        "küçük olduğu için listeyle eşleştirilmesi bir şey söylemez."};
  if(o.tahminde === null)
    return {sinif:"r-yayinyok", metin:"yayın yoktu", gerekce:o.gerekce};
  if(o.tahminde)
    return {sinif:"r-vardi",
      metin:"listede vardı" + (o.kat ? ` · ${o.kat}x` : ""), gerekce:o.gerekce};
  return {sinif:"r-yoktu", metin:"listede yoktu", gerekce:o.gerekce};
}

function satirlariCiz(){
  const q = sadelestir(document.getElementById("q").value.trim());
  const il = document.getElementById("ilsec").value;
  const enAz = +document.getElementById("magsec").value;
  const sadeceListede = document.getElementById("sadeceListede").checked;
  const sadeceTR = document.getElementById("sadeceTR").checked;
  let o = D.olaylar.slice();
  if(sadeceTR) o = o.filter(x=>x.turkiye_ici);
  if(enAz) o = o.filter(x=>x.buyukluk >= enAz);
  if(il) o = o.filter(x=>x.il === il);
  if(sadeceListede) o = o.filter(x=>x.tahminde === true);
  if(q) o = o.filter(x=>sadelestir(x.yer||"").includes(q) ||
    sadelestir(x.il||"").includes(q) || sadelestir(x.ilce||"").includes(q));
  document.getElementById("sayim").textContent =
    `${o.length} / ${D.olaylar.length} olay`;
  const tb = document.getElementById("satirlar");
  if(!o.length){
    tb.innerHTML = `<tr><td colspan="5" class="bosmesaj">Bu ölçütlere uyan
      olay yok. Bu, deprem olmadığı anlamına gelmez — seçtiğiniz süzgeçlerin
      dışında kalmış olabilir.</td></tr>`; return;}
  tb.innerHTML = o.map(x=>{
    const r = durumRozeti(x);
    // Veri UTC, gösterim TSİ (script.js: tsiZaman). Sütun başlığı zaten
    // "TSİ" dediği için her satırda tekrar edilmez.
    const zaman = tsiZaman(x.zaman, {etiket:false});
    return `<tr>
      <td class="t-zaman num">${zaman}</td>
      <td class="t-mag mag">M ${x.buyukluk.toFixed(1).replace(".",",")}</td>
      <td class="t-yer yer">${x.yer || (x.hucre_id + " numaralı alan")}
        <small>${[x.il, x.ilce].filter(Boolean).join(" · ") ||
          (x.turkiye_ici ? "" : "Türkiye dışı")} · ${x.kaynak}</small></td>
      <td class="t-derinlik num" style="color:var(--soluk)">${
        x.derinlik_km == null ? "—" : x.derinlik_km + " km"}</td>
      <td class="t-durum"><span class="rozet ${r.sinif}">${r.metin}</span>
        <div class="gerekce">${r.gerekce}</div></td>
    </tr>`;}).join("");
}

(async()=>{try{
  D = await al("data/son_depremler.json");
  const k = await al("data/kunye.json");
  const t = tazelik(k);
  document.getElementById("u-kunye").innerHTML =
    `yayın <b>${tsiZaman(k.yayin_origin, {etiket:false})}</b> TSİ · ${t.yas}`;
  document.getElementById("altbaslik").textContent = D.kapsam_notu;
  document.getElementById("iddia-notu").innerHTML = D.iddia_notu +
    ` Ayrıntı için <a href="tahmin-kaydi.html">tahmin kaydı</a> ve
      <a href="metodoloji.html">yöntem sayfası</a>.`;
  document.getElementById("kapsam-notu").innerHTML =
    "<b>Kapsam</b> — " + METIN.esikNotu;
  document.getElementById("kaynaklar").textContent = METIN.kaynaklar;

  const ic = D.olaylar.filter(x=>x.turkiye_ici);
  const listede = ic.filter(x=>x.tahminde === true).length;
  document.getElementById("rakamlar").innerHTML = `
    <div class="rakam"><div class="et">Pencere</div>
      <div class="dg">${D.pencere_saat}<small> saat</small></div></div>
    <div class="rakam"><div class="et">Türkiye içi olay</div>
      <div class="dg">${ic.length}</div></div>
    <div class="rakam"><div class="et">Hedef büyüklükte (M4,5+)</div>
      <div class="dg">${D.hedef_buyuklukte}</div></div>
    <div class="rakam"><div class="et">Listede yer alan</div>
      <div class="dg">${listede}<small> / ${ic.length}</small></div></div>`;

  const iller = [...new Set(D.olaylar.map(x=>x.il).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"tr"));
  document.getElementById("ilsec").innerHTML = '<option value="">tüm iller</option>' +
    iller.map(i=>`<option>${i}</option>`).join("");
  ["ilsec","magsec","sadeceListede","sadeceTR"].forEach(id=>
    document.getElementById(id).onchange = satirlariCiz);
  let z; document.getElementById("q").addEventListener("input",()=>{
    clearTimeout(z); z = setTimeout(satirlariCiz,150);});
  satirlariCiz();
}catch(e){
  document.getElementById("altbaslik").textContent =
    "Veri yüklenemedi: " + e.message + " — site verisi kurulmamış olabilir.";}})();
</script>
</body>
